<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>TerminalDisplay 布局夹具（仅 e2e 用）</title>
    <style>
      /* 复刻 App.vue 的高度链：定高容器 → flex 列 → terminal-area → .terminal(flex:1)
         —— min-height:100% 要能解析，父级必须定高。 */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #app {
        height: 600px;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./layout.ts"></script>
  </body>
</html>
